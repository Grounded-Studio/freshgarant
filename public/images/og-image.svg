<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph image placeholder (1200x630).
  Social platforms (WhatsApp, Twitter, LinkedIn, iMessage) show this
  when someone shares a freshgarant.app link. Keep text LARGE because
  these images are rendered at tiny sizes in chat threads.

  Note: most social crawlers prefer PNG/JPG over SVG. For production
  export this to og-image.png at 1200x630 and the <meta> tag already
  points there (see Base.astro). Both files can co-exist.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B5E20"/>
      <stop offset="0.6" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#43A047"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E8F5E9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark, 180x180 -->
  <g transform="translate(80, 110)">
    <rect width="140" height="140" rx="36" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <g transform="translate(10, 10) scale(1.875)">
      <path d="M32 14 C 22 14, 14 22, 14 32 C 14 42, 24 50, 32 50 C 32 42, 32 30, 38 22 C 36 18, 34 15, 32 14 Z"
            fill="url(#leaf3)"/>
      <path d="M22 32 L 28 38 L 38 26" stroke="#2E7D32" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="240" y="200"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1"
        fill="#FFFFFF">FreshGarant</text>

  <!-- Tagline -->
  <text x="80" y="360"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2"
        fill="#FFFFFF">Never waste</text>
  <text x="80" y="450"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2"
        fill="#FFFFFF">food again.</text>

  <!-- Subtext -->
  <text x="80" y="520"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="26" font-weight="500"
        fill="rgba(255,255,255,0.85)">Scan your groceries. Cook what's fresh.</text>

  <!-- Domain -->
  <text x="80" y="570"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="600" letter-spacing="2"
        fill="rgba(255,255,255,0.6)">FRESHGARANT.APP</text>
</svg>
